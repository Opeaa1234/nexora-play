name: Deploy Chess Edge Function to Supabase Staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-staging-chess
  cancel-in-progress: false

jobs:
  deploy-chess-staging:
    if: github.ref == 'refs/heads/redevelopment/phase-2-homepage'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out reviewed staging branch
        uses: actions/checkout@v4

      - name: Set up Node.js for repository validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Deno for Chess validation
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate pages and multiplayer security guardrails
        run: node scripts/validate-project.mjs

      - name: Type-check Chess Edge Function
        run: deno check supabase/functions/submit-chess-move/index.ts

      - name: Run Chess move validation tests
        run: deno test supabase/functions/submit-chess-move/validation_test.ts

      - name: Verify staging-only credentials are configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN to GitHub Actions secrets."
            exit 1
          fi
          if [[ -z "$SUPABASE_STAGING_PROJECT_REF" ]]; then
            echo "::error::Add SUPABASE_STAGING_PROJECT_REF to GitHub Actions secrets."
            exit 1
          fi
          if [[ ! "$SUPABASE_STAGING_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "::error::SUPABASE_STAGING_PROJECT_REF must be the 20-character staging project ref."
            exit 1
          fi
          # Hard stop: never let a misconfigured staging secret deploy to the known live project.
          if [[ "$SUPABASE_STAGING_PROJECT_REF" == "umcdpqnewicffvvyajef" ]]; then
            echo "::error::The staging project ref matches Nexora Play production. Refusing deployment."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Chess Edge Function to staging only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        run: supabase functions deploy submit-chess-move --project-ref "$SUPABASE_STAGING_PROJECT_REF"
