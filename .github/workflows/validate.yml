name: Validate Nexora Play

on:
  pull_request:
  push:
    branches:
      - main
      - redevelopment/phase-2-homepage

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check chess Edge Function
        run: deno check supabase/functions/submit-chess-move/index.ts
      - name: Test chess move validation
        run: deno test supabase/functions/submit-chess-move/validation_test.ts
      - name: Validate pages and multiplayer security guardrails
        run: node scripts/validate-project.mjs
